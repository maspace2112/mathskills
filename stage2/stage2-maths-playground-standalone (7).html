{id:'one',label:'1 more · 1 less',subtitle:'Tiny steps',desc:'Use your number line thinking to find the number just before or after.',tone:'teal',icon:'→',qs:[['What is 1 more than 38?',39,[37,39,48,40],'Move one step forwards.'],['What is 1 less than 70?',69,[71,60,69,79],'Move one step backwards.'],['What is 1 more than 99?',100,[98,109,100,90],'The next number after 99 is a new hundred.'],['What is 1 less than 46?',45,[47,44,45,36],'Count back one.'],['What is 1 more than 24?',25,[23,26,34,25],'Count on one.']]},

{id:'twos',label:'Count in 2s',subtitle:'Hop together',desc:'Count forwards and backwards in twos with even-number hops.',tone:'purple',icon:'✣',qs:[['What comes next? 12, 14, 16, __',18,[17,18,20,24],'Add 2 each time.'],['What comes before 22 when counting in 2s?',20,[19,20,21,24],'Take away 2.'],['Which number is missing? 8, 10, __, 14',12,[11,12,13,16],'The even numbers are hopping.'],['What comes next? 30, 28, 26, __',24,[22,24,25,28],'Count backwards by 2.'],['What is the 5th number? 2, 4, 6, 8, __',10,[9,10,12,14],'There are five hops from zero.']]},
{id:'fives',label:'Count in 5s',subtitle:'High-five counting',desc:'Make groups of five and follow the pattern forwards or back.',tone:'blue',icon:'♢',qs:[['What comes next? 15, 20, 25, __',30,[26,30,35,40],'Add 5 each time.'],['What comes before 40 when counting in 5s?',35,[30,34,35,45],'40 take away 5 is 35.'],['Which number is missing? 5, 10, __, 20',15,[12,14,15,25],'Look for the five-step pattern.'],['What comes next? 50, 45, 40, __',35,[30,35,36,55],'Count backwards by 5.'],['How many fingers are 6 groups of 5?',30,[11,25,30,35],'Count five, ten, fifteen…']]},
{id:'tens',label:'Count in 10s',subtitle:'Rocket jumps',desc:'Spot the pattern when the ones stay put and the tens move.',tone:'coral',icon:'♜',qs:[['What comes next? 20, 30, 40, __',50,[41,45,50,60],'Add one ten each time.'],['What comes before 80 when counting in 10s?',70,[60,70,79,90],'80 take away 10 is 70.'],['Which number is missing? 30, __, 50, 60',40,[35,40,45,70],'The tens are climbing by one.'],['What comes next? 100, 90, 80, __',70,[60,70,75,90],'Count backwards by ten.'],['What is 4 tens?',40,[4,14,40,44],'Four groups of ten make 40.']]}
,{id:'ordinal',label:'Ordinal numbers',subtitle:'Podium dash',desc:'Race through positions and choose who is 1st, 2nd, 3rd or 10th.',tone:'teal',icon:'🏁',qs:[['Which position is the winner? 🏆', '1st',['1st','2nd','3rd','4th'],'The winner comes in first — that is 1st.'],['Mia is after Leo and before Sam. What position is Mia? 🧒 🧑 🧒','2nd',['1st','2nd','3rd','4th'],'Mia is second in the line-up.'],['Which runner is in 3rd place? 🐢 🐰 🦊 🐼','Fox',['Turtle','Rabbit','Fox','Panda'],'Count from the front: turtle 1st, rabbit 2nd, fox 3rd.'],['What comes after 9th?','10th',['8th','9th','10th','11th'],'After 9th comes 10th.'],['Which position is just before 5th?','4th',['3rd','4th','5th','6th'],'One place before 5th is 4th.']]}

,{id:'numberline',label:'Missing numbers',subtitle:'Number line steps',desc:'Each step is 1. Find the number hiding between the jumps.',tone:'yellow',icon:'↔',qs:[['What number is missing? 16, __, 18',17,[15,16,17,19],'The number line moves one step at a time: 16, 17, 18.'],['What number is missing? 23, 24, __, 26',25,[22,24,25,27],'Count one step after 24.'],['What number is missing? __, 41, 42',40,[39,40,43,44],'One step before 41 is 40.'],['What number is missing? 67, __, 69, 70',68,[66,68,69,71],'After 67 comes 68, then 69, then 70.'],['What number is missing? 88, 89, __, 91',90,[87,88,90,92],'The number between 89 and 91 is 90.']]}

];

const ordinalPeople=[
  ['Ava','people/person-01.png','👧'],['Ben','people/person-02.png','👦'],['Chloe','people/person-03.png','👩'],['Daniel','people/person-04.png','👨'],['Ella','people/person-05.png','👧'],
  ['Finn','people/person-06.png','👦'],['Grace','people/person-07.png','👩'],['Hugo','people/person-08.png','👨'],['Ivy','people/person-09.png','👧'],['Jack','people/person-10.png','👦']
];
const ordinalAnimals=[
  ['Panda','animals/animal-01.png','🐼'],['Lion','animals/animal-02.png','🦁'],['Bunny','animals/animal-03.png','🐰'],['Fox','animals/animal-04.png','🦊'],['Koala','animals/animal-05.png','🐨'],
  ['Tiger','animals/animal-06.png','🐯'],['Penguin','animals/animal-07.png','🐧'],['Frog','animals/animal-08.png','🐸'],['Dog','animals/animal-09.png','🐶'],['Cat','animals/animal-10.png','🐱']
];
let ordinalRound=0,ordinalScore=0,ordinalPick=null;
function ordinalGame(){const useAnimals=ordinalRound%2===1;const source=useAnimals?ordinalAnimals:ordinalPeople;const start=(ordinalRound*3)%6;const lineup=[source[start],source[(start+1)%10],source[(start+2)%10],source[(start+3)%10],source[(start+4)%10]];const modes=[['Who is in 1st place?',0],['Who is in 3rd place?',2],['What position is '+lineup[3][0]+' in?',3],['Who is immediately before '+lineup[4][0]+'?',3],['What position is '+lineup[1][0]+' in?',1]];const mode=modes[ordinalRound%5];const prompt=mode[0],answer=mode[1];const positionQuestion=prompt.startsWith('What position is');const hidePlaces=positionQuestion;const picked=ordinalPick!==null;screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><div class="game-top"><div class="eyebrow"><span class="dot"></span>Podium dash</div><div class="count">Question ${ordinalRound+1} <span>/ 5</span></div></div><div class="track"><div class="fill" style="width:${Math.max(((ordinalRound+(picked?1:0))/5)*100,6)}%;background:var(--teal)"></div></div><section class="question"><div class="qdecor">✦ · ✦</div><div class="ordinal-mode">${useAnimals?'Animal line-up':'People line-up'}</div><div class="ordinal-question">${prompt}</div><div class="ordinal-board"><span class="board-label">Click the correct place</span><div class="ordinal-lineup">${lineup.map((item,i)=>`<button class="ordinal-person ${ordinalPick===i?'chosen':''} ${picked&&i===answer?'correct':''} ${ordinalPick===i&&i!==answer?'wrong':''}" onclick="${positionQuestion?'':'ordinalChoose('+i+')'}" ${picked?'disabled':''}><img class="ordinal-image" src="${item[1]}" alt="${item[0]}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="ordinal-fallback">${item[2]}</span><span class="ordinal-name">${item[0]}</span>${hidePlaces?'':`<span class="ordinal-place">${['1st','2nd','3rd','4th','5th'][i]}</span>`}</button>`).join('')}</div><div class="board-foot">The first place is <strong>1st</strong>. Count from left to right.</div></div>${positionQuestion?`<div class="position-options"><span class="board-label">Choose the position</span><div class="position-option-grid">${['1st','2nd','3rd','4th'].map((place,i)=>`<button class="position-option ${ordinalPick===i?'chosen':''} ${picked&&i===answer?'correct':''} ${ordinalPick===i&&i!==answer?'wrong':''}" onclick="ordinalChoose(${i})" ${picked?'disabled':''}>${place}</button>`).join('')}</div></div>`:''}<div class="feedback ${!picked?'hide':ordinalPick===answer?'correct':'wrongbox'}">${picked?`<span>${ordinalPick===answer?'✓':'💡'}</span><span><strong>${ordinalPick===answer?'Brilliant!':'Good try!'}</strong> ${ordinalPick===answer?'That position is correct.':`The correct position is ${['1st','2nd','3rd','4th','5th'][answer]}.`}</span>`:''}</div><div class="question-actions"><span class="ordinal-note">${picked?'Great thinking — now continue!':'Look carefully at the position labels.'}</span><button class="next" onclick="ordinalNext()" ${!picked?'disabled':''}>${ordinalRound===4?'See my score':'Next question'} &nbsp;→</button></div></section></main>`}
function ordinalChoose(n){if(ordinalPick!==null)return;ordinalPick=n;const answer=[0,2,3,3,1][ordinalRound%5];if(n===answer)ordinalScore++;ordinalGame()}
function ordinalNext(){if(ordinalPick===null)return;if(ordinalRound===4){ordinalResults();return}ordinalRound++;ordinalPick=null;ordinalGame()}
function ordinalResults(){screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><section class="results"><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="result-icon">🏆</div><div class="eyebrow"><span class="dot"></span>Podium dash complete</div><h1>Brilliant line-up!</h1><p class="score">You scored <strong>${ordinalScore} out of 5</strong></p><p class="result-note">You used the position labels to solve the line-up. That is ordinal number thinking!</p><div class="result-actions"><button class="primary" onclick="start(current)">↻ &nbsp;Play again</button><button class="secondary" onclick="home()">Choose another topic &nbsp;→</button></div></section></main>`}

const colors={coral:'coral',teal:'teal',yellow:'yellow',purple:'purple',blue:'blue'};let current=null,index=0,selected=null,score=0,hint=false;
const screen=document.getElementById('screen');
function home(){screen.innerHTML=`<main class="main"><section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span>Ready, set, think!</div><h1>Maths can be<br><em>an adventure.</em></h1><p>Choose a topic, warm up your brain, and have a go. No pressure — just clever little steps.</p><div class="hero-actions"><button class="primary" onclick="start(topics[0])">▶ &nbsp;Start a game</button><span class="note"><b>✣</b> 5 questions per round</span></div></div><div class="art"><div class="cloud a"></div><div class="cloud b"></div><div class="sun">✦</div><div class="num one"><small>tens</small><strong>4</strong></div><div class="num two"><small>ones</small><strong>7</strong></div><div class="line"><i>20</i><i>30</i><i class="active">40</i><i>50</i><i>60</i><b>→</b></div><div class="pencil">✎</div><div class="spark s1">✦</div><div class="spark s2">✦</div></div></section><section class="topics"><div class="heading"><div><div class="eyebrow"><span class="dot"></span>Pick your practice</div><h2>What shall we explore?</h2></div><div class="total"><strong>${topics.length}</strong><span>topics to try</span></div></div><div class="grid">${topics.map((t,i)=>`<article class="card ${t.tone}" style="animation-delay:${i*45}ms"><div class="card-top"><div class="icon">${t.icon}</div></div><div class="copy"><div class="sub">${t.subtitle}</div><h3>${t.label}</h3><p>${t.desc}</p></div><button class="play" onclick="start(topics[${i}])">Play game &nbsp;→</button></article>`).join('')}</div><div class="encourage"><div class="encourage-icon">♙</div><div><strong>Small steps make big progress.</strong><span>Try one game today — you might surprise yourself.</span></div><div class="encourage-stars">★ ★ ★</div></div></section></main><footer class="footer"><span>Made for curious minds</span><span class="footer-dots">• • •</span><span>Take your time. You've got this.</span></footer>`;window.scrollTo({top:0,behavior:'smooth'})}
function start(topic){current=topic;index=0;selected=null;score=0;hint=false;ordinalRound=0;ordinalScore=0;ordinalPick=null;current.id==='ordinal'?ordinalGame():game();window.scrollTo({top:0,behavior:'smooth'})}
function numberLineVisual(){const sets=[['16','?','18'],['23','24','?','26'],['?','41','42'],['67','?','69','70'],['88','89','?','91']];const values=sets[index]||sets[0];const missing=Math.max(0,values.indexOf('?'));return `<div class=\"number-line-visual\"><span class=\"line-label\">Each step is 1</span><div class=\"rail\"></div><div class=\"steps\" style=\"--steps:${values.length}\">${values.map((value,i)=>`<div class=\"step ${value==='?'?'missing':''}\"><span class=\"step-number\">${value}</span><span class=\"tick\"></span><small>${i===0?'start':i===values.length-1?'finish':'step '+i}</small></div>`).join('')}</div><span class=\"pointer\" style=\"left:${((missing+.5)/values.length)*100}%\">▼</span><div class=\"direction\">The arrow points to the <strong>missing number</strong></div></div>`}
function game(){const q=current.qs[index],answered=selected!==null,correct=selected===q[1],progress=((index+(answered?1:0))/current.qs.length)*100;screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><div class="game-top"><div class="eyebrow"><span class="dot"></span>${current.subtitle}</div><div class="count">Question ${index+1} <span>/ ${current.qs.length}</span></div></div><div class="track"><div class="fill" style="width:${Math.max(progress,6)}%;background:var(--${current.tone==='yellow'?'yellow':current.tone==='teal'?'teal':current.tone==='purple'?'purple':current.tone==='blue'?'blue':'coral'})"></div></div>${index==='done'?results():`<section class="question"><div class="qdecor">✦ · ✦</div><div class="qlabel">Let's solve it</div><h1>${q[0]}</h1>${current.id==='numberline'?numberLineVisual():''}<div class="answers">${q[2].map(n=>`<button class="answer ${selected===n?'chosen':''} ${answered&&n===q[1]?'right':''} ${selected===n&&n!==q[1]?'wrong':''}" onclick='choose(${JSON.stringify(n)})' ${answered?'disabled':''}><span class="answer-number">${n}</span><span class="status">${answered&&n===q[1]?'✓':selected===n?'×':''}</span></button>`).join('')}</div><div class="feedback ${!answered?'hide':correct?'correct':'wrongbox'}">${answered?`<span>${correct?'✓':'💡'}</span><span><strong>${correct?'Brilliant!':'Good try!'}</strong> ${correct?'That answer is spot on.':`The answer is ${q[1]}. ${q[3]}`}</span>`:''}</div><div class="question-actions"><button class="hint" onclick="toggleHint()">? &nbsp;${hint?'Hide hint':'Need a hint?'}</button><button class="next" onclick="next()" ${!answered?'disabled':''}>${index===current.qs.length-1?'See my score':'Next question'} &nbsp;→</button></div>${hint?`<div class="hintbox">💡 <span>${q[3]}</span></div>`:''}</section>`}</main>`}
function choose(n){if(selected!==null)return;selected=n;if(n===current.qs[index][1])score++;game()}
function toggleHint(){hint=!hint;game()}
function next(){if(selected===null)return;if(index===current.qs.length-1){index='done';resultsPage()}else{index++;selected=null;hint=false;game()}}
function resultsPage(){screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><section class="results"><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="result-icon">🏆</div><div class="eyebrow"> <span class="dot"></span>Round complete</div><h1>You did it!</h1><p class="score">You scored <strong>${score} out of ${current.qs.length}</strong></p><p class="result-note">Every question is a chance to learn. Your maths brain is getting stronger.</p><div class="result-actions"><button class="primary" onclick="start(current)">↻ &nbsp;Play again</button><button class="secondary" onclick="home()">Choose another topic &nbsp;→</button></div></section></main>`}
function results(){return ''}home();
</script>
