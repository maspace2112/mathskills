function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function shuffle(arr){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function mkOpts(correct,candidates){const set=new Set([correct]);for(const c of shuffle(candidates)){if(set.size>=4)break;if(c>=0&&c!==correct)set.add(c)}let guard=0;while(set.size<4&&guard<40){const d=correct+(Math.random()<.5?-1:1)*randInt(1,12);if(d>=0&&!set.has(d))set.add(d);guard++}return shuffle([...set])}

function hlText(t){const esc=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return esc.replace(/(\bcount in \d+s\b|\bin \d+s\b|\b\d+s\b|\b\d+ (?:more|less)\b|\bcount(?:ing)? (?:on|back(?:wards)?|forwards?)\b)|(\b\d+(?:st|nd|rd|th)?\b)/gi,(m,key,num)=>key?'<mark class="hl hl-key">'+m+'</mark>':'<mark class="hl hl-num">'+m+'</mark>')}

function genPlace(){const order=shuffle(['value','ones','build','build','value']);return order.map(t=>{
if(t==='value'){const num=randInt(10,99),tens=Math.floor(num/10),ones=num%10,answer=tens*10;return [`In ${num}, what is the value of the ${tens} digit?`,answer,mkOpts(answer,[tens,ones,num,ones*10]),`The ${tens} is in the tens place.`]}
if(t==='ones'){const num=randInt(10,99),tens=Math.floor(num/10),ones=num%10;return [`How many ones are in ${num}?`,ones,mkOpts(ones,[tens,tens*10,ones*10,num]),'Look at the digit on the right.']}

})}
function genOne(){const qs=[];for(let i=0;i<5;i++){const more=Math.random()<.5,n=more?randInt(0,98):randInt(1,99),answer=more?n+1:n-1;qs.push([`What is 1 ${more?'more':'less'} than ${n}?`,answer,mkOpts(answer,[n,answer+10,answer-10,more?n-1:n+1]),more?'Count on one.':'Count back one.'])}return qs}
function genTen(){const qs=[];for(let i=0;i<5;i++){const more=Math.random()<.5,n=more?randInt(0,90):randInt(10,99),answer=more?n+10:n-10;qs.push([`What is 10 ${more?'more':'less'} than ${n}?`,answer,mkOpts(answer,[n,answer+1,answer-1,more?n-10:n+10]),more?'Add one ten to the tens digit.':'Take one ten away.'])}return qs}
function sequenceVisual(seq){return `<div class="seq-visual">${seq.map((v,i)=>`${i>0?'<span class="seq-arrow">→</span>':''}<div class="seq-chip ${v==='?'?'missing':''}">${v==='?'?'<span class="blank-line"></span>':`<span>${v}</span>`}</div>`).join('')}</div>`}
function genCounting(step,maxN){const qs=[],used=new Set();for(let i=0;i<5;i++){const len=randInt(3,5),desc=Math.random()<.35;let k;do{k=desc?randInt(len,maxN+len):randInt(2,maxN)}while(used.has(k+(desc?'d':'a')));used.add(k+(desc?'d':'a'));const base=step*k;const nums=Array.from({length:len},(_,j)=>desc?base-step*j:base+step*j);const missingIdx=randInt(0,len-1);const answer=nums[missingIdx];const seq=nums.map((v,j)=>j===missingIdx?'?':String(v));const prompt=missingIdx===len-1?'What comes next in the pattern?':missingIdx===0?'What number starts this pattern?':'Which number is missing from the pattern?';const hint=desc?`Count backwards by ${step} each step.`:`Add ${step} each step.`;qs.push([prompt,answer,mkOpts(answer,[answer-step,answer+step,answer-1,answer+1]),hint,seq])}return qs}
function genNumberline(){const qs=[];for(let i=0;i<5;i++){const len=randInt(3,4),start=randInt(10,96-len),missingIdx=randInt(0,len-1);const tokens=[];let answer=0;for(let j=0;j<len;j++){const val=start+j;if(j===missingIdx){tokens.push('__');answer=val}else tokens.push(String(val))}qs.push([`What number is missing? ${tokens.join(', ')}`,answer,mkOpts(answer,[answer-1,answer+1,answer-2,answer+2]),'The number line moves one step at a time.'])}return qs}

];
let ordinalRound=0,ordinalScore=0,ordinalPick=null,ordinalSeed=0,ordinalOrder=[0,1,2,3,4];
function ordinalGame(){const useAnimals=ordinalRound%2===1;const source=useAnimals?ordinalAnimals:ordinalPeople;const start=((ordinalRound*3)+ordinalSeed)%10;const lineup=[source[start],source[(start+1)%10],source[(start+2)%10],source[(start+3)%10],source[(start+4)%10]];const modes=[['Who is in 1st place?',0],['Who is in 3rd place?',2],['What position is '+lineup[3][0]+' in?',3],['Who is immediately before '+lineup[4][0]+'?',3],['What position is '+lineup[1][0]+' in?',1]];const mode=modes[ordinalOrder[ordinalRound%5]];const prompt=mode[0],answer=mode[1];const positionQuestion=prompt.startsWith('What position is');const hidePlaces=positionQuestion;const picked=ordinalPick!==null;screen.innerHTML=`<main class="game"><section class="question"><div class="ordinal-question">${hlText(prompt)}</div><div class="ordinal-board"><div class="ordinal-lineup">${lineup.map((item,i)=>`<button class="ordinal-person ${ordinalPick===i?'chosen':''} ${picked&&i===answer?'correct':''} ${ordinalPick===i&&i!==answer?'wrong':''}" onclick="${positionQuestion?'':'ordinalChoose('+i+')'}" ${picked?'disabled':''}><img class="ordinal-image" src="${item[1]}" alt="${item[0]}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="ordinal-fallback">${item[2]}</span><span class="ordinal-name">${item[0]}</span><span class="ordinal-place" style="visibility:${picked?'visible':'hidden'}">${['1st','2nd','3rd','4th','5th'][i]}</span></button>`).join('')}</div></div>${positionQuestion?`<div class="position-options"><div class="position-option-grid">${['1st','2nd','3rd','4th'].map((place,i)=>`<button class="position-option ${ordinalPick===i?'chosen':''} ${picked&&i===answer?'correct':''} ${ordinalPick===i&&i!==answer?'wrong':''}" onclick="ordinalChoose(${i})" ${picked?'disabled':''}>${place}</button>`).join('')}</div></div>`:''}<div class="question-actions"><button class="next" onclick="ordinalNext()" ${!picked?'disabled':''}>Next &nbsp;→</button></div></section></main>`}
function ordinalChoose(n){if(ordinalPick!==null)return;ordinalPick=n;const answer=[0,2,3,3,1][ordinalOrder[ordinalRound%5]];const ok=n===answer;if(ok)ordinalScore++;playSound(ok?'correct':'wrong');ordinalGame();scheduleAuto(ok,ordinalNext)}
function ordinalNext(){if(ordinalPick===null)return;ordinalRound++;ordinalPick=null;if(ordinalRound%5===0){ordinalOrder=shuffle([0,1,2,3,4]);ordinalSeed=randInt(0,9)}ordinalGame()}
function ordinalResults(){screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><section class="results"><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="result-icon">${mascotVisual('happy')}</div><div class="eyebrow"><span class="dot"></span>Podium dash complete</div><h1>Brilliant line-up!</h1><p class="score">You scored <strong>${ordinalScore} out of 5</strong></p><p class="result-note">You used the position labels to solve the line-up. That is ordinal number thinking!</p><div class="result-actions"><button class="primary" onclick="start(current)">↻ &nbsp;Play again</button><button class="secondary" onclick="home()">Choose another topic &nbsp;→</button></div></section></main>`}

const colors={coral:'coral',teal:'teal',yellow:'yellow',purple:'purple',blue:'blue'};let current=null,index=0,selected=null,score=0,hint=false;
const screen=document.getElementById('screen');
function home(){clearAuto();document.body.classList.remove('in-game');screen.innerHTML=`<main class="main home"><div class="grid">${topics.map((t,i)=>`<button class="card ${t.tone}" style="animation-delay:${i*45}ms" onclick="start(topics[${i}])"><div class="icon">${iconVisual(t.id)}</div><h3>${t.label}</h3></button>`).join('')}</div></main>`;window.scrollTo({top:0,behavior:'smooth'})}
function start(topic){clearAuto();document.body.classList.add('in-game');current=topic;if(typeof topic.gen==='function')current.qs=topic.gen();index=0;selected=null;score=0;hint=false;ordinalRound=0;ordinalScore=0;ordinalPick=null;ordinalSeed=randInt(0,9);ordinalOrder=shuffle([0,1,2,3,4]);current.id==='ordinal'?ordinalGame():game();window.scrollTo({top:0,behavior:'smooth'})}
function numberLineVisual(){const qtext=current.qs[index][0];const seqMatch=qtext.match(/missing\?\s*(.+)$/);const values=(seqMatch?seqMatch[1]:'').split(',').map(x=>x.trim()).map(x=>x==='__'?'?':x);return `<div class="number-line-visual"><div class="steps" style="--steps:${values.length}"><div class="rail"></div>${values.map(value=>`<div class="step ${value==='?'?'missing':''}"><span class="step-number">${value}</span><span class="tick"></span>${value==='?'?'<span class="pointer">▼</span>':''}</div>`).join('')}</div></div>`}
function game(){const q=current.qs[index],answered=selected!==null,correct=selected===q[1];screen.innerHTML=`<main class="game"><section class="question"><div class="q-mascot">${mascotVisual(!answered?'idle':correct?'happy':'hmm')}</div><h1>${hlText(current.id==='numberline'?q[0].split('?')[0]+'?':q[0])}</h1>${q[4]?sequenceVisual(q[4]):(current.id==='numberline'?numberLineVisual():'')}<div class="answers">${q[2].map(n=>`<button class="answer ${selected===n?'chosen':''} ${answered&&n===q[1]?'right':''} ${selected===n&&n!==q[1]?'wrong':''}" onclick='choose(${JSON.stringify(n)})' ${answered?'disabled':''}><span class="answer-number">${n}</span><span class="status">${answered&&n===q[1]?'✓':selected===n?'×':''}</span></button>`).join('')}</div><div class="question-actions"><button class="next" onclick="next()" ${!answered?'disabled':''}>Next &nbsp;→</button></div></section></main>`}
function choose(n){if(selected!==null)return;selected=n;const ok=n===current.qs[index][1];if(ok)score++;playSound(ok?'correct':'wrong');game();scheduleAuto(ok,next)}
function toggleHint(){hint=!hint;game()}
function next(){if(selected===null)return;if(index>=current.qs.length-1){if(typeof current.gen==='function')current.qs=current.gen();index=0}else{index++}selected=null;hint=false;game()}
function resultsPage(){screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><section class="results"><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="result-icon">${mascotVisual('happy')}</div><div class="eyebrow"> <span class="dot"></span>Round complete</div><h1>You did it!</h1><p class="score">You scored <strong>${score} out of ${current.qs.length}</strong></p><p class="result-note">Every question is a chance to learn. Your maths brain is getting stronger.</p><div class="result-actions"><button class="primary" onclick="start(current)">↻ &nbsp;Play again</button><button class="secondary" onclick="home()">Choose another topic &nbsp;→</button></div></section></main>`}
function results(){return ''}home();
</script>
</body>
