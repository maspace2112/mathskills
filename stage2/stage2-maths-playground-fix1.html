<script>

function mascotSVG(mood){
const eyes=mood==='happy'?'<path d="M36 47q4-6 8 0" stroke="#1f2638" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M56 47q4-6 8 0" stroke="#1f2638" stroke-width="4" stroke-linecap="round" fill="none"/>':mood==='hmm'?'<circle cx="40" cy="49" r="3.2" fill="#1f2638"/><circle cx="60" cy="49" r="3.2" fill="#1f2638"/>':'<circle cx="40" cy="48" r="3.6" fill="#1f2638"/><circle cx="60" cy="48" r="3.6" fill="#1f2638"/>';
const mouth=mood==='happy'?'<path d="M39 58q11 11 22 0" stroke="#1f2638" stroke-width="4" stroke-linecap="round" fill="none"/>':mood==='hmm'?'<path d="M42 61h16" stroke="#1f2638" stroke-width="4" stroke-linecap="round" fill="none"/>':'<path d="M41 58q9 7 18 0" stroke="#1f2638" stroke-width="3.4" stroke-linecap="round" fill="none"/>';

}
function mascotVisual(mood){return `<span class="mascot"><img class="mascot-img" src="img/mascot/${mood}.png" alt="" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="mascot-fallback">${mascotSVG(mood)}</span></span>`}
function iconVisual(id){return `<span class="icon-visual"><img class="icon-img" src="img/icons/${id}.png" alt="" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="icon-fallback">${topicIcons[id]||''}</span></span>`}
function toggleFullscreen(){if(!document.fullscreenElement){(document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen())?.catch?.(()=>{})}else{document.exitFullscreen&&document.exitFullscreen()}}
const topicIcons={
place:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="13" y="4" width="4" height="4" rx="1"/><rect x="13" y="10" width="4" height="4" rx="1"/><rect x="13" y="16" width="4" height="4" rx="1"/></svg>',
one:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.4"/><path d="M11 12h8m0 0-3.2-3.2M19 12l-3.2 3.2"/></svg>',
ten:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.8 2.4 4.3 5.6 4.3 9a4.3 4.3 0 1 1-8.6 0c0-3.4 1.5-6.6 4.3-9Z"/><path d="M9.7 15.8 8 19.5m6.3-3.7 1.7 3.7M10.8 12.3h2.4"/></svg>',
twos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M9 13.5 15 10.5"/></svg>',
fives:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-7m4.5 7v-10m4.5 10v-12m4.5 12v-9m4.5 9v-6"/></svg>',
tens:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h4v-4h4v-4h4v-4h4V4"/></svg>',
ordinal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h5v-6H3v6Zm6.5 0h5V9h-5v11Zm6.5 0h5.5v-4H16v4Z"/></svg>',
numberline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M6 9v6M11 9v6M18 9v6"/></svg>'
};

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function shuffle(arr){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function mkOpts(correct,candidates){const set=new Set([correct]);for(const c of shuffle(candidates)){if(set.size>=4)break;if(c>=0&&c!==correct)set.add(c)}let guard=0;while(set.size<4&&guard<40){const d=correct+(Math.random()<.5?-1:1)*randInt(1,12);if(d>=0&&!set.has(d))set.add(d);guard++}return shuffle([...set])}
function nth(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function playSound(name){try{const a=new Audio('sounds/'+name+'.mp3');a.volume=.55;a.play().catch(()=>{})}catch(e){}}
function genPlace(){const order=shuffle(['value','ones','build','build','value']);return order.map(t=>{
if(t==='value'){const num=randInt(10,99),tens=Math.floor(num/10),ones=num%10,answer=tens*10;return [`In ${num}, what is the value of the ${tens} digit?`,answer,mkOpts(answer,[tens,ones,num,ones*10]),`The ${tens} is in the tens place.`]}
if(t==='ones'){const num=randInt(10,99),tens=Math.floor(num/10),ones=num%10;return [`How many ones are in ${num}?`,ones,mkOpts(ones,[tens,tens*10,ones*10,num]),'Look at the digit on the right.']}
const tens=randInt(1,9),ones=randInt(0,9),answer=tens*10+ones,swapped=ones*10+tens;return [`What number is ${tens} tens and ${ones} ones?`,answer,mkOpts(answer,[swapped,answer+1,answer-1,tens*10]),`${tens} tens is ${tens*10}. Add ${ones} ones.`]
})}
function genOne(){const qs=[];for(let i=0;i<5;i++){const more=Math.random()<.5,n=more?randInt(0,98):randInt(1,99),answer=more?n+1:n-1;qs.push([`What is 1 ${more?'more':'less'} than ${n}?`,answer,mkOpts(answer,[n,answer+10,answer-10,more?n-1:n+1]),more?'Count on one.':'Count back one.'])}return qs}
function genTen(){const qs=[];for(let i=0;i<5;i++){const more=Math.random()<.5,n=more?randInt(0,90):randInt(10,99),answer=more?n+10:n-10;qs.push([`What is 10 ${more?'more':'less'} than ${n}?`,answer,mkOpts(answer,[n,answer+1,answer-1,more?n-10:n+10]),more?'Add one ten to the tens digit.':'Take one ten away.'])}return qs}
function sequenceVisual(seq){return `<div class="seq-visual">${seq.map((v,i)=>`${i>0?'<span class="seq-arrow">→</span>':''}<div class="seq-chip ${v==='?'?'missing':''}">${v==='?'?'<span class="blank-line"></span>':`<span>${v}</span>`}</div>`).join('')}</div>`}
function genCounting(step,maxN){const qs=[],used=new Set();for(let i=0;i<5;i++){const len=randInt(3,5),desc=Math.random()<.35;let k;do{k=desc?randInt(len,maxN+len):randInt(2,maxN)}while(used.has(k+(desc?'d':'a')));used.add(k+(desc?'d':'a'));const base=step*k;const nums=Array.from({length:len},(_,j)=>desc?base-step*j:base+step*j);const missingIdx=randInt(0,len-1);const answer=nums[missingIdx];const seq=nums.map((v,j)=>j===missingIdx?'?':String(v));const prompt=missingIdx===len-1?'What comes next in the pattern?':missingIdx===0?'What number starts this pattern?':'Which number is missing from the pattern?';const hint=desc?`Count backwards by ${step} each step.`:`Add ${step} each step.`;qs.push([prompt,answer,mkOpts(answer,[answer-step,answer+step,answer-1,answer+1]),hint,seq])}return qs}
function genNumberline(){const qs=[];for(let i=0;i<5;i++){const len=randInt(3,4),start=randInt(10,96-len),missingIdx=randInt(0,len-1);const tokens=[];let answer=0;for(let j=0;j<len;j++){const val=start+j;if(j===missingIdx){tokens.push('__');answer=val}else tokens.push(String(val))}qs.push([`What number is missing? ${tokens.join(', ')}`,answer,mkOpts(answer,[answer-1,answer+1,answer-2,answer+2]),'The number line moves one step at a time.'])}return qs}
const topics=[
{id:'place',label:'Tens & ones',subtitle:'Build a number',desc:'Split numbers into tens and ones, then spot the value of each digit.',tone:'coral',gen:genPlace},
{id:'one',label:'1 more \u00b7 1 less',subtitle:'Tiny steps',desc:'Use your number line thinking to find the number just before or after.',tone:'teal',gen:genOne},
{id:'ten',label:'10 more \u00b7 10 less',subtitle:'Big jumps',desc:'Jump by a whole ten and notice which digit changes.',tone:'yellow',gen:genTen},
{id:'twos',label:'Count in 2s',subtitle:'Hop together',desc:'Count forwards and backwards in twos with even-number hops.',tone:'purple',gen:()=>genCounting(2,20)},
{id:'fives',label:'Count in 5s',subtitle:'High-five counting',desc:'Make groups of five and follow the pattern forwards or back.',tone:'blue',gen:()=>genCounting(5,14)},
{id:'tens',label:'Count in 10s',subtitle:'Rocket jumps',desc:'Spot the pattern when the ones stay put and the tens move.',tone:'coral',gen:()=>genCounting(10,8)}
,{id:'ordinal',label:'Ordinal numbers',subtitle:'Podium dash',desc:'Race through positions and choose who is 1st, 2nd, 3rd or 10th.',tone:'teal'}
,{id:'numberline',label:'Missing numbers',subtitle:'Number line steps',desc:'Each step is 1. Find the number hiding between the jumps.',tone:'yellow',gen:genNumberline}
];

const ordinalPeople=[
  ['Ava','img/people/person-01.png','👧'],['Ben','img/people/person-02.png','👦'],['Chloe','img/people/person-03.png','👩'],['Daniel','img/people/person-04.png','👨'],['Ella','img/people/person-05.png','👧'],
  ['Finn','img/people/person-06.png','👦'],['Grace','img/people/person-07.png','👩'],['Hugo','img/people/person-08.png','👨'],['Ivy','img/people/person-09.png','👧'],['Jack','img/people/person-10.png','👦']
];
const ordinalAnimals=[
  ['Panda','img/animals/animal-01.png','🐼'],['Lion','img/animals/animal-02.png','🦁'],['Bunny','img/animals/animal-03.png','🐰'],['Fox','img/animals/animal-04.png','🦊'],['Koala','img/animals/animal-05.png','🐨'],
  ['Tiger','img/animals/animal-06.png','🐯'],['Penguin','img/animals/animal-07.png','🐧'],['Frog','img/animals/animal-08.png','🐸'],['Dog','img/animals/animal-09.png','🐶'],['Cat','img/animals/animal-10.png','🐱']
];
let ordinalRound=0,ordinalScore=0,ordinalPick=null,ordinalSeed=0,ordinalOrder=[0,1,2,3,4];
function ordinalGame(){const useAnimals=ordinalRound%2===1;const source=useAnimals?ordinalAnimals:ordinalPeople;const start=((ordinalRound*3)+ordinalSeed)%10;const lineup=[source[start],source[(start+1)%10],source[(start+2)%10],source[(start+3)%10],source[(start+4)%10]];const modes=[['Who is in 1st place?',0],['Who is in 3rd place?',2],['What position is '+lineup[3][0]+' in?',3],['Who is immediately before '+lineup[4][0]+'?',3],['What position is '+lineup[1][0]+' in?',1]];const mode=modes[ordinalOrder[ordinalRound%5]];const prompt=mode[0],answer=mode[1];const positionQuestion=prompt.startsWith('What position is');const hidePlaces=positionQuestion;const picked=ordinalPick!==null;screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><div class="game-top"><div class="eyebrow"><span class="dot"></span>Podium dash</div><div class="count">Question ${ordinalRound+1} <span>/ 5</span></div></div><div class="track"><div class="fill" style="width:${Math.max(((ordinalRound+(picked?1:0))/5)*100,6)}%;background:var(--teal)"></div></div><section class="question"><div class="qdecor">✦ · ✦</div><div class="ordinal-mode">${useAnimals?'Animal line-up':'People line-up'}</div><div class="ordinal-question">${prompt}</div><div class="ordinal-board"><span class="board-label">Click the correct place</span><div class="ordinal-lineup">${lineup.map((item,i)=>`<button class="ordinal-person ${ordinalPick===i?'chosen':''} ${picked&&i===answer?'correct':''} ${ordinalPick===i&&i!==answer?'wrong':''}" onclick="${positionQuestion?'':'ordinalChoose('+i+')'}" ${picked?'disabled':''}><img class="ordinal-image" src="${item[1]}" alt="${item[0]}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="ordinal-fallback">${item[2]}</span><span class="ordinal-name">${item[0]}</span>${hidePlaces?'':`<span class="ordinal-place">${['1st','2nd','3rd','4th','5th'][i]}</span>`}</button>`).join('')}</div><div class="board-foot">The first place is <strong>1st</strong>. Count from left to right.</div></div>${positionQuestion?`<div class="position-options"><span class="board-label">Choose the position</span><div class="position-option-grid">${['1st','2nd','3rd','4th'].map((place,i)=>`<button class="position-option ${ordinalPick===i?'chosen':''} ${picked&&i===answer?'correct':''} ${ordinalPick===i&&i!==answer?'wrong':''}" onclick="ordinalChoose(${i})" ${picked?'disabled':''}>${place}</button>`).join('')}</div></div>`:''}<div class="feedback ${!picked?'hide':ordinalPick===answer?'correct':'wrongbox'}">${picked?`<span>${ordinalPick===answer?'✓':'💡'}</span><span><strong>${ordinalPick===answer?'Brilliant!':'Good try!'}</strong> ${ordinalPick===answer?'That position is correct.':`The correct position is ${['1st','2nd','3rd','4th','5th'][answer]}.`}</span>`:''}</div><div class="question-actions"><span class="ordinal-note">${picked?'Great thinking — now continue!':'Look carefully at the position labels.'}</span><button class="next" onclick="ordinalNext()" ${!picked?'disabled':''}>${ordinalRound===4?'See my score':'Next question'} &nbsp;→</button></div></section></main>`}
function ordinalChoose(n){if(ordinalPick!==null)return;ordinalPick=n;const answer=[0,2,3,3,1][ordinalOrder[ordinalRound%5]];const ok=n===answer;if(ok)ordinalScore++;playSound(ok?'correct':'wrong');ordinalGame()}
function ordinalNext(){if(ordinalPick===null)return;if(ordinalRound===4){ordinalResults();return}ordinalRound++;ordinalPick=null;ordinalGame()}
function ordinalResults(){screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><section class="results"><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="result-icon">${mascotVisual('happy')}</div><div class="eyebrow"><span class="dot"></span>Podium dash complete</div><h1>Brilliant line-up!</h1><p class="score">You scored <strong>${ordinalScore} out of 5</strong></p><p class="result-note">You used the position labels to solve the line-up. That is ordinal number thinking!</p><div class="result-actions"><button class="primary" onclick="start(current)">↻ &nbsp;Play again</button><button class="secondary" onclick="home()">Choose another topic &nbsp;→</button></div></section></main>`}

const colors={coral:'coral',teal:'teal',yellow:'yellow',purple:'purple',blue:'blue'};let current=null,index=0,selected=null,score=0,hint=false;
const screen=document.getElementById('screen');
function home(){screen.innerHTML=`<main class="main"><section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span>Ready, set, think!</div><h1>Maths can be<br><em>an adventure.</em></h1><p>Choose a topic, warm up your brain, and have a go. No pressure — just clever little steps.</p></div><div class="art"><div class="cloud a"></div><div class="cloud b"></div><div class="sun">✦</div><div class="num one"><small>tens</small><strong>4</strong></div><div class="num two"><small>ones</small><strong>7</strong></div><div class="line"><i>20</i><i>30</i><i class="active">40</i><i>50</i><i>60</i><b>→</b></div><div class="pencil">✎</div><div class="spark s1">✦</div><div class="spark s2">✦</div><div class="hero-mascot">${mascotVisual('idle')}</div></div></section><section class="topics"><div class="heading"><div><div class="eyebrow"><span class="dot"></span>Pick your practice</div><h2>What shall we explore?</h2></div><div class="total"><strong>${topics.length}</strong><span>topics to try</span></div></div><div class="grid">${topics.map((t,i)=>`<article class="card ${t.tone}" style="animation-delay:${i*45}ms"><div class="card-top"><div class="icon">${iconVisual(t.id)}</div></div><div class="copy"><div class="sub">${t.subtitle}</div><h3>${t.label}</h3><p>${t.desc}</p></div><button class="play" onclick="start(topics[${i}])">Play game &nbsp;→</button></article>`).join('')}</div><div class="encourage"><div class="encourage-icon">♙</div><div><strong>Small steps make big progress.</strong><span>Try one game today — you might surprise yourself.</span></div><div class="encourage-stars">★ ★ ★</div></div></section></main><footer class="footer"><span>Made for curious minds</span><span class="footer-dots">• • •</span><span>Take your time. You've got this.</span></footer>`;window.scrollTo({top:0,behavior:'smooth'})}
function start(topic){current=topic;if(typeof topic.gen==='function')current.qs=topic.gen();index=0;selected=null;score=0;hint=false;ordinalRound=0;ordinalScore=0;ordinalPick=null;ordinalSeed=randInt(0,9);ordinalOrder=shuffle([0,1,2,3,4]);current.id==='ordinal'?ordinalGame():game();window.scrollTo({top:0,behavior:'smooth'})}
function numberLineVisual(){const qtext=current.qs[index][0];const seqMatch=qtext.match(/missing\?\s*(.+)$/);const values=(seqMatch?seqMatch[1]:'').split(',').map(x=>x.trim()).map(x=>x==='__'?'?':x);const missing=Math.max(0,values.indexOf('?'));return `<div class=\"number-line-visual\"><span class=\"line-label\">Each step is 1</span><div class=\"rail\"></div><div class=\"steps\" style=\"--steps:${values.length}\">${values.map((value,i)=>`<div class=\"step ${value==='?'?'missing':''}\"><span class=\"step-number\">${value}</span><span class=\"tick\"></span><small>${i===0?'start':i===values.length-1?'finish':'step '+i}</small></div>`).join('')}</div><span class=\"pointer\" style=\"left:${((missing+.5)/values.length)*100}%\">▼</span><div class=\"direction\">The arrow points to the <strong>missing number</strong></div></div>`}
function game(){const q=current.qs[index],answered=selected!==null,correct=selected===q[1],progress=((index+(answered?1:0))/current.qs.length)*100;screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><div class="game-top"><div class="eyebrow"><span class="dot"></span>${current.subtitle}</div><div class="count">Question ${index+1} <span>/ ${current.qs.length}</span></div></div><div class="track"><div class="fill" style="width:${Math.max(progress,6)}%;background:var(--${current.tone==='yellow'?'yellow':current.tone==='teal'?'teal':current.tone==='purple'?'purple':current.tone==='blue'?'blue':'coral'})"></div></div>${index==='done'?results():`<section class="question"><div class="qdecor">✦ · ✦</div><div class="q-mascot">${mascotVisual(!answered?'idle':correct?'happy':'hmm')}</div><div class="qlabel">Let's solve it</div><h1>${q[0]}</h1>${q[4]?sequenceVisual(q[4]):(current.id==='numberline'?numberLineVisual():'')}<div class="answers">${q[2].map(n=>`<button class="answer ${selected===n?'chosen':''} ${answered&&n===q[1]?'right':''} ${selected===n&&n!==q[1]?'wrong':''}" onclick='choose(${JSON.stringify(n)})' ${answered?'disabled':''}><span class="answer-number">${n}</span><span class="status">${answered&&n===q[1]?'✓':selected===n?'×':''}</span></button>`).join('')}</div><div class="feedback ${!answered?'hide':correct?'correct':'wrongbox'}">${answered?`<span>${correct?'✓':'💡'}</span><span><strong>${correct?'Brilliant!':'Good try!'}</strong> ${correct?'That answer is spot on.':`The answer is ${q[1]}. ${q[3]}`}</span>`:''}</div><div class="question-actions"><button class="hint" onclick="toggleHint()">? &nbsp;${hint?'Hide hint':'Need a hint?'}</button><button class="next" onclick="next()" ${!answered?'disabled':''}>${index===current.qs.length-1?'See my score':'Next question'} &nbsp;→</button></div>${hint?`<div class="hintbox">💡 <span>${q[3]}</span></div>`:''}</section>`}</main>`}
function choose(n){if(selected!==null)return;selected=n;const ok=n===current.qs[index][1];if(ok)score++;playSound(ok?'correct':'wrong');game()}
function toggleHint(){hint=!hint;game()}
function next(){if(selected===null)return;if(index===current.qs.length-1){index='done';resultsPage()}else{index++;selected=null;hint=false;game()}}
function resultsPage(){screen.innerHTML=`<main class="game"><button class="back" onclick="home()">← &nbsp;Back to all topics</button><section class="results"><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="result-icon">${mascotVisual('happy')}</div><div class="eyebrow"> <span class="dot"></span>Round complete</div><h1>You did it!</h1><p class="score">You scored <strong>${score} out of ${current.qs.length}</strong></p><p class="result-note">Every question is a chance to learn. Your maths brain is getting stronger.</p><div class="result-actions"><button class="primary" onclick="start(current)">↻ &nbsp;Play again</button><button class="secondary" onclick="home()">Choose another topic &nbsp;→</button></div></section></main>`}
function results(){return ''}home();
</script>
</body>
</html>
